name: Build Linea Besu Package with Credible plugin

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - credible/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Build plugins and assemble linea-besu-package
        id: build
        uses: ./.github/actions/linea-besu-package/build-plugins-and-assemble
        with:
          release_tag_prefix: credible
          with_besu_fleet_plugin: 'false'
          fleet_github_app_id: ''
          fleet_github_app_private_key: ''

      - name: Download Credible plugin JAR
        run: |
          cd linea-besu-package && ./scripts/assemble-credible.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          context: ./linea-besu-package/linea-besu
          file: ./linea-besu-package/linea-besu/Dockerfile
          tags: |
            ghcr.io/${{ github.repository }}/linea-besu-package:${{ github.sha }}
            ghcr.io/${{ github.repository }}/linea-besu-package:${{ github.ref_name }}
